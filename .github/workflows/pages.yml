name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede a queued one, but never cancel a deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # No build step — the app is plain ES modules and CSS. This only separates
      # what gets served from what is repo furniture (tests, icon generator, docs).
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js .nojekyll css js icons _site/

          # Stamp the build so the service worker can defeat the HTTP cache.
          # Pages serves assets with a fixed Cache-Control: max-age=600 and a
          # worker cannot override it, so the worker requests each asset with a
          # ?b=<build> tag the cache has never seen. That tag has to change every
          # deploy or an installed app keeps booting the previous version for ten
          # minutes. See the comment in sw.js.
          BUILD="${GITHUB_SHA:0:12}"
          sed -i "s/^const BUILD = 'dev';/const BUILD = '${BUILD}';/" _site/sw.js
          grep -q "const BUILD = '${BUILD}';" _site/sw.js \
            || { echo "::error::failed to stamp BUILD into sw.js"; exit 1; }
          echo "stamped build ${BUILD}"

          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
